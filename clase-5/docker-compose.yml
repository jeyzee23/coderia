services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-dev-c5
    restart: unless-stopped
    ports:
      - "5682:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5682/
      - N8N_EDITOR_BASE_URL=http://localhost:5682/
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      - N8N_ENCRYPTION_KEY=0f7f4c58d8c51a47c2df832293afee1cb3d8c0a7c6fd6e6edbc8d853c1c5c402
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - DB_TYPE=sqlite
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL}
    volumes:
      - n8n_data_c5:/home/node/.n8n

volumes:
  n8n_data_c5:
